<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disk Usage</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }
  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 20px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 32px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #f8fafc;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 13px;
    color: #64748b;
  }
  .rescan-btn {
    background: none;
    border: 1px solid #334155;
    color: #94a3b8;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .rescan-btn:hover { border-color: #6366f1; color: #e2e8f0; }
  .rescan-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .rescan-btn .icon { display: inline-block; }
  .rescan-btn.scanning .icon { animation: spin 1s linear infinite; }
  .breadcrumbs {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 24px;
    font-size: 13px;
    flex-wrap: wrap;
  }
  .breadcrumb { color: #6366f1; cursor: pointer; }
  .breadcrumb:hover { text-decoration: underline; }
  .breadcrumb-current { color: #f8fafc; font-weight: 600; }
  .breadcrumb-sep { color: #475569; }
  .chart-container {
    display: flex;
    justify-content: center;
    margin-bottom: 32px;
  }
  .scan-time {
    font-size: 12px;
    color: #475569;
    margin-top: -24px;
    margin-bottom: 24px;
    text-align: center;
  }
  .file-row {
    display: grid;
    grid-template-columns: 1fr 100px 80px;
    align-items: center;
    padding: 10px 16px;
    border-radius: 8px;
    transition: background 0.15s;
  }
  .file-row:hover { background: #1e293b; }
  .file-row.clickable { cursor: pointer; }
  .file-name {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .file-icon { font-size: 14px; opacity: 0.5; width: 16px; text-align: center; }
  .file-label {
    font-size: 14px;
    color: #e2e8f0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-bar-container { display: flex; align-items: center; }
  .file-bar {
    height: 4px;
    border-radius: 2px;
    min-width: 2px;
    transition: width 0.3s;
  }
  .file-size {
    font-size: 13px;
    color: #94a3b8;
    font-family: 'DM Mono', monospace;
    text-align: right;
  }
  .back-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: #94a3b8;
    transition: background 0.15s;
  }
  .back-row:hover { background: #1e293b; }
  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 16px;
    color: #64748b;
    font-size: 14px;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #1e293b;
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 12px;
    color: #ef4444;
    font-size: 14px;
    text-align: center;
    padding: 20px;
  }
  .file-row.active { background:#1e293b; }

  /* Root carousel — bleeds wider than the 640px column; everything else stays put. */
  .carousel-viewport {
    position: relative;
    left: 50%;
    transform: translateX(-50%);
    width: min(90vw, 1100px);
    overflow: hidden;
    height: 300px;
    margin-bottom: 32px;
  }
  .carousel-track {
    position: absolute;
    top: 0;
    left: 50%;
    height: 100%;
    display: flex;
    align-items: center;
    gap: 24px;
    transition: transform 0.45s cubic-bezier(.4,0,.2,1);
  }
  .donut-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
  }
  .donut-slot.selected { margin: 0 28px; }
  .donut-slot:not(.selected) { cursor: pointer; }
  .donut-slot:not(.selected):hover svg { filter: brightness(1.15); }
  .donut-ring {
    border-radius: 50%;
    transition: width 0.45s cubic-bezier(.4,0,.2,1), height 0.45s cubic-bezier(.4,0,.2,1);
  }
  .donut-ring.placeholder { background: #1e293b; opacity: 0.5; cursor: pointer; }
  .donut-label {
    font-size: 12px;
    color: #94a3b8;
    white-space: nowrap;
    max-width: 76px; /* must match THUMB_SIZE in app.js so slot width is always exactly THUMB_SIZE */
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .edge-fade {
    position: absolute;
    top: 0; bottom: 0;
    width: 56px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 2;
  }
  .edge-fade.left { left: 0; background: linear-gradient(90deg, #0f172a, transparent); }
  .edge-fade.right { right: 0; background: linear-gradient(270deg, #0f172a, transparent); }
  .edge-fade.show { opacity: 1; }
  .chevron {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #1e293b;
    border: 1px solid #334155;
    color: #94a3b8;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    z-index: 3;
    transition: color 0.2s, border-color 0.2s;
  }
  .chevron:hover { color: #f8fafc; border-color: #6366f1; }
  .chevron.left { left: 8px; }
  .chevron.right { right: 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/htm.js"></script>
<script src="app.js"></script>
</body>
</html>
